# Machine-readable source registry for the Phase 4 ingestion contract. Phase 5
# will parse this file; no source-specific URL should be hidden in Python code.
contract_version = 1
provider_id = "statistics_canada"
provider_name = "Statistics Canada"
language = "en"
raw_subdirectory = "statcan"
cube_metadata_api_url = "https://www150.statcan.gc.ca/t1/wds/rest/getCubeMetadata"
statistics_canada_licence_url = "https://www.statcan.gc.ca/en/terms-conditions/open-licence"
cmhc_licence_url = "https://www.cmhc-schl.gc.ca/professionals/housing-markets-data-and-research/housing-data/cmhc-licence-agreement-use-of-data"

[http]
connect_timeout_seconds = 10
read_timeout_seconds = 120
download_deadline_seconds = 1800
max_attempts = 4
backoff_base_seconds = 1
backoff_cap_seconds = 30
retry_after_cap_seconds = 300
retryable_status_codes = [408, 409, 425, 429, 500, 502, 503, 504]

[profiles.development]
# The permits archive is deliberately excluded because its current compressed
# size is roughly 365 MB. Its downloader behavior will be covered by mocked
# tests before the first full-profile run.
source_ids = [
    "cmhc_housing_activity",
    "cmhc_starts_by_market",
    "statcan_new_housing_price_index",
]
reference_start = "2024-01"
reference_end = "2025-12"
cma_names = [
    "Toronto, Ontario",
    "Vancouver, British Columbia",
    "Calgary, Alberta",
]
cma_codes = ["535", "933", "825"]

[profiles.full]
source_ids = [
    "cmhc_housing_activity",
    "cmhc_starts_by_market",
    "statcan_building_permits",
    "statcan_new_housing_price_index",
]
reference_start = "2016-01"
reference_end = "2025-12"
geography_scope = "all_cma_rows_available_per_source"

